<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guichês - Somos do Bem</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
    }
    .header p {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: 5px;
    }
    .guiches {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    @media (max-width: 700px) {
      .guiches { grid-template-columns: 1fr; }
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border: 1px solid #0f3460;
    }
    .card h2 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #e94560;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card h2 span {
      background: #e94560;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .info-box {
      background: #0f3460;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      min-height: 80px;
    }
    .info-box .label {
      font-size: 0.8rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .info-box .value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-top: 5px;
    }
    .info-box .tipo {
      font-size: 0.95rem;
      color: #90caf9;
      margin-top: 4px;
    }
    .btn-chamar {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #e94560;
      color: white;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-chamar:hover { background: #c73a52; }
    .btn-chamar:active { transform: scale(0.98); }
    .btn-chamar:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .btn-recall {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 2px solid #ff9800;
      border-radius: 12px;
      background: transparent;
      color: #ff9800;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-recall:hover { background: rgba(255,152,0,0.15); }
    .btn-recall:disabled {
      border-color: #555;
      color: #555;
      cursor: not-allowed;
    }
    .btn-finalizar {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 2px solid #4caf50;
      border-radius: 12px;
      background: transparent;
      color: #4caf50;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-finalizar:hover { background: rgba(76,175,80,0.15); }
    .btn-finalizar:disabled {
      border-color: #555;
      color: #555;
      cursor: not-allowed;
    }
    .fila-info {
      margin-top: 25px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #0f3460;
    }
    .fila-info h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #90caf9;
    }
    .fila-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .fila-item {
      background: #0f3460;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #ddd;
    }
    .status-bar {
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: #888;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .online { color: #4caf50; }
    .btn-limpar {
      padding: 8px 16px;
      border: 1px solid #666;
      border-radius: 8px;
      background: transparent;
      color: #aaa;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-limpar:hover {
      border-color: #e94560;
      color: #e94560;
    }
    .storage-info {
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Painel dos Guichês</h1>
    <p>Somos do Bem · Sistema de Atendimento</p>
  </div>

  <div class="guiches">
    <!-- Guichê 1 -->
    <div class="card">
      <h2><span>1</span> Guichê 1</h2>
      <div class="info-box">
        <div class="label">Senha atual</div>
        <div class="value" id="g1-numero">—</div>
        <div class="tipo" id="g1-tipo">Nenhuma senha chamada</div>
      </div>
      <button class="btn-chamar" id="btn-g1" onclick="chamarProxima(1)">Chamar Próxima</button>
      <button class="btn-recall" id="btn-rec-g1" onclick="chamarNovamente(1)" disabled>🔔 Chamar Novamente</button>
      <button class="btn-finalizar" id="btn-fin-g1" onclick="finalizar(1)" disabled>Finalizar Atendimento</button>
    </div>

    <!-- Guichê 2 -->
    <div class="card">
      <h2><span>2</span> Guichê 2</h2>
      <div class="info-box">
        <div class="label">Senha atual</div>
        <div class="value" id="g2-numero">—</div>
        <div class="tipo" id="g2-tipo">Nenhuma senha chamada</div>
      </div>
      <button class="btn-chamar" id="btn-g2" onclick="chamarProxima(2)">Chamar Próxima</button>
      <button class="btn-recall" id="btn-rec-g2" onclick="chamarNovamente(2)" disabled>🔔 Chamar Novamente</button>
      <button class="btn-finalizar" id="btn-fin-g2" onclick="finalizar(2)" disabled>Finalizar Atendimento</button>
    </div>
  </div>

  <div class="fila-info">
    <h3>Fila de espera (<span id="qtd-fila">0</span>)</h3>
    <div class="fila-list" id="lista-fila">
      <span style="color:#666">Carregando...</span>
    </div>
  </div>

  <div class="status-bar">
    <div>
      Status: <span id="api-status" class="online">Conectado</span>
      · <span class="storage-info" id="storage-info">— registros</span>
    </div>
    <button class="btn-limpar" onclick="limparAtendidos()" title="Apaga senhas já finalizadas para liberar espaço no MockAPI (limite 100)">
      🗑 Limpar atendidos
    </button>
  </div>

  <script>
    const API = 'https://698deef5aded595c25308e9f.mockapi.io/Senhas';
    const LIMITE_MOCK = 100;
    const LIMITE_ALERTA = 85; // começa a limpar sozinho acima disso

    let senhaAtual = { 1: null, 2: null };

    function getId(item) {
      return item.Id || item.id;
    }

    async function fetchSenhas() {
      try {
        const res = await fetch(API + '?sortBy=numero&order=asc');
        if (!res.ok) throw new Error('API error ' + res.status);
        document.getElementById('api-status').textContent = 'Conectado';
        document.getElementById('api-status').className = 'online';
        return await res.json();
      } catch (e) {
        console.error(e);
        document.getElementById('api-status').textContent = 'Offline / Erro';
        document.getElementById('api-status').className = '';
        return [];
      }
    }

    function atualizarBotoes(guiche) {
      const temSenha = !!senhaAtual[guiche];
      document.getElementById(`btn-g${guiche}`).disabled = temSenha;
      document.getElementById(`btn-rec-g${guiche}`).disabled = !temSenha;
      document.getElementById(`btn-fin-g${guiche}`).disabled = !temSenha;
    }

    async function atualizarFila() {
      const senhas = await fetchSenhas();
      const total = senhas.length;
      document.getElementById('storage-info').textContent = `${total} / ${LIMITE_MOCK} registros`;

      // Auto-limpeza se estiver perto do limite
      if (total >= LIMITE_ALERTA) {
        const atendidos = senhas.filter(s => s.status === 'atendido');
        if (atendidos.length > 10) {
          console.log('Limite próximo — limpando atendidos antigos...');
          await limparAtendidos(true); // silent
          return; // vai atualizar de novo
        }
      }

      const aguardando = senhas.filter(s => s.status === 'aguardando');
      const lista = document.getElementById('lista-fila');
      document.getElementById('qtd-fila').textContent = aguardando.length;

      if (aguardando.length === 0) {
        lista.innerHTML = '<span style="color:#666">Nenhuma senha na fila</span>';
      } else {
        lista.innerHTML = aguardando.map(s =>
          `<span class="fila-item">${String(s.numero).padStart(4,'0')} · ${s.tipo.split('/')[0]}</span>`
        ).join('');
      }

      // Sincroniza senhas "chamado" nos guichês
      for (let g of [1, 2]) {
        const atual = senhas.find(s => s.guiche == g && s.status === 'chamado');
        if (atual) {
          senhaAtual[g] = atual;
          document.getElementById(`g${g}-numero`).textContent = String(atual.numero).padStart(4,'0');
          document.getElementById(`g${g}-tipo`).textContent = atual.tipo;
          atualizarBotoes(g);
        } else if (!senhaAtual[g]) {
          document.getElementById(`g${g}-numero`).textContent = '—';
          document.getElementById(`g${g}-tipo`).textContent = 'Nenhuma senha chamada';
          atualizarBotoes(g);
        }
      }
    }

    async function chamarProxima(guiche) {
      const btn = document.getElementById(`btn-g${guiche}`);
      btn.disabled = true;
      btn.textContent = 'Chamando...';

      try {
        const senhas = await fetchSenhas();
        const proxima = senhas
          .filter(s => s.status === 'aguardando')
          .sort((a, b) => Number(a.numero) - Number(b.numero))[0];

        if (!proxima) {
          alert('Não há senhas na fila!');
          btn.disabled = false;
          btn.textContent = 'Chamar Próxima';
          return;
        }

        const id = getId(proxima);
        const res = await fetch(`${API}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...proxima,
            status: 'chamado',
            guiche: guiche,
            chamadoEm: new Date().toISOString()
          })
        });

        if (!res.ok) {
          const t = await res.text();
          throw new Error('Erro ao chamar: ' + res.status + ' ' + t);
        }

        const atualizada = await res.json();
        senhaAtual[guiche] = atualizada;

        document.getElementById(`g${guiche}-numero`).textContent = String(atualizada.numero).padStart(4,'0');
        document.getElementById(`g${guiche}-tipo`).textContent = atualizada.tipo;
        atualizarBotoes(guiche);
        atualizarFila();
      } catch (err) {
        console.error(err);
        alert('Erro ao chamar senha: ' + err.message);
        btn.disabled = false;
      }
      btn.textContent = 'Chamar Próxima';
    }

    // Rechama a senha atual (atualiza chamadoEm para o painel tocar de novo)
    async function chamarNovamente(guiche) {
      if (!senhaAtual[guiche]) return;

      const btn = document.getElementById(`btn-rec-g${guiche}`);
      btn.disabled = true;
      btn.textContent = 'Chamando...';

      try {
        const s = senhaAtual[guiche];
        const id = getId(s);

        const res = await fetch(`${API}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...s,
            status: 'chamado',
            guiche: guiche,
            chamadoEm: new Date().toISOString() // novo timestamp → painel detecta e toca som
          })
        });

        if (!res.ok) throw new Error('Erro ' + res.status);

        const atualizada = await res.json();
        senhaAtual[guiche] = atualizada;

        // Feedback visual rápido
        const numEl = document.getElementById(`g${guiche}-numero`);
        numEl.style.color = '#ff9800';
        setTimeout(() => { numEl.style.color = '#fff'; }, 800);

      } catch (err) {
        console.error(err);
        alert('Erro ao chamar novamente: ' + err.message);
      }

      btn.disabled = false;
      btn.textContent = '🔔 Chamar Novamente';
    }

    async function finalizar(guiche) {
      if (!senhaAtual[guiche]) return;

      try {
        const s = senhaAtual[guiche];
        const id = getId(s);

        await fetch(`${API}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...s,
            status: 'atendido'
          })
        });

        senhaAtual[guiche] = null;
        document.getElementById(`g${guiche}-numero`).textContent = '—';
        document.getElementById(`g${guiche}-tipo`).textContent = 'Nenhuma senha chamada';
        atualizarBotoes(guiche);
        atualizarFila();
      } catch (err) {
        console.error(err);
        alert('Erro ao finalizar: ' + err.message);
      }
    }

    // Apaga registros com status "atendido" para liberar espaço (limite 100 do MockAPI)
    async function limparAtendidos(silent = false) {
      try {
        const senhas = await fetchSenhas();
        const atendidos = senhas.filter(s => s.status === 'atendido');

        if (atendidos.length === 0) {
          if (!silent) alert('Não há senhas atendidas para limpar.');
          return;
        }

        if (!silent) {
          const ok = confirm(`Apagar ${atendidos.length} senha(s) já finalizada(s)?\nIsso libera espaço no MockAPI (limite de 100).`);
          if (!ok) return;
        }

        // Apaga em paralelo (lotes de 5 para não sobrecarregar)
        const lote = 5;
        for (let i = 0; i < atendidos.length; i += lote) {
          const batch = atendidos.slice(i, i + lote);
          await Promise.all(batch.map(s =>
            fetch(`${API}/${getId(s)}`, { method: 'DELETE' })
          ));
        }

        if (!silent) {
          alert(`${atendidos.length} registro(s) removido(s). Espaço liberado!`);
        }
        atualizarFila();
      } catch (err) {
        console.error(err);
        if (!silent) alert('Erro ao limpar: ' + err.message);
      }
    }

    // Inicialização
    atualizarFila();
    setInterval(atualizarFila, 3000);
  </script>
</body>
</html>
