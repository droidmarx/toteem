<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Senhas - Somos do Bem</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      background: rgba(0,0,0,0.35);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #f9c74f, #90be6d, #4d908e, #577590, #9b5de5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
    }
    .brand-text h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }
    .brand-text p {
      font-size: 0.7rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .clock {
      font-size: 1.5rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 10px;
      min-height: 0;
    }
    .label {
      font-size: 1.15rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 12px;
    }
    .senha-box {
      background: rgba(255,255,255,0.08);
      border: 3px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      padding: 28px 50px;
      text-align: center;
      min-width: 360px;
      max-width: 95vw;
      box-shadow: 0 16px 50px rgba(0,0,0,0.4);
      transition: all 0.4s ease;
    }
    .senha-box.highlight {
      border-color: #4caf50;
      box-shadow: 0 0 40px rgba(76,175,80,0.45), 0 16px 50px rgba(0,0,0,0.4);
      transform: scale(1.03);
    }
    .numero {
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 6px;
      line-height: 1;
      margin: 8px 0;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .tipo {
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-weight: 600;
      color: #90caf9;
      margin-top: 8px;
      max-width: 480px;
    }
    .guiche-info {
      margin-top: 18px;
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .guiche-badge {
      background: #e94560;
      padding: 6px 22px;
      border-radius: 50px;
      font-size: clamp(1.2rem, 3.5vw, 1.7rem);
    }
    .sem-senha {
      font-size: 1.6rem;
      opacity: 0.5;
    }
    .pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    /* Histórico por tipo */
    .historico-section {
      flex-shrink: 0;
      padding: 12px 16px 20px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    .historico-title {
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 12px;
    }
    .historico-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (max-width: 900px) {
      .historico-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .historico-grid { grid-template-columns: 1fr; }
    }
    .hist-card {
      background: rgba(0,0,0,0.28);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .hist-card h3 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      opacity: 0.85;
      line-height: 1.3;
      min-height: 2.4em;
    }
    .hist-card.green h3 { color: #81c784; }
    .hist-card.dark h3 { color: #a5d6a7; }
    .hist-card.orange h3 { color: #ffb74d; }
    .hist-card.purple h3 { color: #9fa8da; }
    .hist-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .hist-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .hist-row .num {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .hist-row .g {
      font-size: 0.75rem;
      opacity: 0.7;
    }
    .hist-empty {
      font-size: 0.8rem;
      opacity: 0.4;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon">S</div>
      <div class="brand-text">
        <h1>Somos do Bem</h1>
        <p>Associação Beneficente</p>
      </div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="main">
    <div class="label">Senha chamada</div>
    <div class="senha-box" id="senhaBox">
      <div id="conteudo">
        <div class="sem-senha">Aguardando chamada...</div>
      </div>
    </div>
  </div>

  <div class="historico-section">
    <div class="historico-title">Últimos 5 atendimentos por tipo</div>
    <div class="historico-grid" id="historicoGrid">
      <!-- preenchido via JS -->
    </div>
  </div>

  <script>
    const API = 'https://698deef5aded595c25308e9f.mockapi.io/Senhas';
    let ultimaChamadaKey = null; // id + chamadoEm (permite rechamada)

    // Histórico por tipo (máx 5 cada)
    const historicoPorTipo = {
      'TERAPIAS/CONSULTAS AGENDADAS': [],
      'AGENDAMENTO DE CONSULTAS': [],
      'SOLICITAÇÃO DE LAUDOS E RECEITAS': [],
      'SERVIÇO SOCIAL': []
    };

    const coresTipo = {
      'TERAPIAS/CONSULTAS AGENDADAS': 'green',
      'AGENDAMENTO DE CONSULTAS': 'dark',
      'SOLICITAÇÃO DE LAUDOS E RECEITAS': 'orange',
      'SERVIÇO SOCIAL': 'purple'
    };

    // Neste projeto o MockAPI retorna "Id" (maiúsculo)
    function getId(item) {
      return item.Id || item.id;
    }

    // ========== SOM POR TIPO ==========
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, startTime, type = 'sine', volume = 0.35) {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function tocarSom(tipo) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        switch (tipo) {
          case 'TERAPIAS/CONSULTAS AGENDADAS':
            // 3 tons ascendentes suaves (verde)
            playTone(523, 0.18, now, 'sine', 0.3);        // C5
            playTone(659, 0.18, now + 0.2, 'sine', 0.3);   // E5
            playTone(784, 0.28, now + 0.4, 'sine', 0.35);  // G5
            break;

          case 'AGENDAMENTO DE CONSULTAS':
            // 2 tons médios
            playTone(440, 0.22, now, 'triangle', 0.35);      // A4
            playTone(554, 0.3, now + 0.25, 'triangle', 0.35); // C#5
            break;

          case 'SOLICITAÇÃO DE LAUDOS E RECEITAS':
            // Tom mais agudo + eco
            playTone(880, 0.15, now, 'square', 0.22);       // A5
            playTone(880, 0.15, now + 0.2, 'square', 0.18);
            playTone(988, 0.25, now + 0.4, 'square', 0.25); // B5
            break;

          case 'SERVIÇO SOCIAL':
            // 4 notes (mais chamativo)
            playTone(392, 0.15, now, 'sine', 0.3);          // G4
            playTone(494, 0.15, now + 0.16, 'sine', 0.3);   // B4
            playTone(587, 0.15, now + 0.32, 'sine', 0.3);   // D5
            playTone(784, 0.3, now + 0.48, 'sine', 0.35);   // G5
            break;

          default:
            // Som genérico
            playTone(600, 0.2, now, 'sine', 0.3);
            playTone(800, 0.25, now + 0.22, 'sine', 0.3);
        }
      } catch (e) {
        console.warn('Não foi possível tocar som:', e);
      }
    }

    // ========== RELÓGIO ==========
    function atualizarRelogio() {
      const agora = new Date();
      document.getElementById('clock').textContent = agora.toLocaleTimeString('pt-BR', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    // ========== HISTÓRICO ==========
    function renderHistorico() {
      const grid = document.getElementById('historicoGrid');
      const tipos = Object.keys(historicoPorTipo);

      grid.innerHTML = tipos.map(tipo => {
        const itens = historicoPorTipo[tipo];
        const cor = coresTipo[tipo] || '';
        const nomeCurto = tipo.length > 28 ? tipo.substring(0, 26) + '…' : tipo;

        let listaHtml;
        if (itens.length === 0) {
          listaHtml = '<div class="hist-empty">Nenhum ainda</div>';
        } else {
          listaHtml = '<div class="hist-list">' + itens.map(h => `
            <div class="hist-row">
              <span class="num">${String(h.numero).padStart(4, '0')}</span>
              <span class="g">Guichê ${h.guiche}</span>
            </div>
          `).join('') + '</div>';
        }

        return `
          <div class="hist-card ${cor}">
            <h3>${nomeCurto}</h3>
            ${listaHtml}
          </div>
        `;
      }).join('');
    }

    function adicionarAoHistorico(chamada) {
      const tipo = chamada.tipo;
      if (!historicoPorTipo[tipo]) {
        historicoPorTipo[tipo] = [];
      }
      // Evita duplicata
      if (historicoPorTipo[tipo].some(h => h.numero === chamada.numero && h.guiche === chamada.guiche)) {
        return;
      }
      historicoPorTipo[tipo].unshift({
        numero: chamada.numero,
        guiche: chamada.guiche
      });
      if (historicoPorTipo[tipo].length > 5) {
        historicoPorTipo[tipo].pop();
      }
      renderHistorico();
    }

    // ========== BUSCA DE CHAMADAS ==========
    async function buscarUltimaChamada() {
      try {
        const res = await fetch(API + '?status=chamado&sortBy=chamadoEm&order=desc');
        if (!res.ok) return;
        const data = await res.json();

        if (data.length === 0) {
          if (!ultimaChamadaKey) {
            document.getElementById('conteudo').innerHTML = '<div class="sem-senha">Aguardando chamada...</div>';
            document.getElementById('senhaBox').classList.remove('highlight');
          }
          return;
        }

        const chamada = data[0];
        const chamadaKey = getId(chamada) + "|" + (chamada.chamadoEm || "");

        if (chamadaKey !== ultimaChamadaKey) {
          ultimaChamadaKey = chamadaKey;

          // Atualiza painel
          document.getElementById('conteudo').innerHTML = `
            <div class="numero pulse">${String(chamada.numero).padStart(4, '0')}</div>
            <div class="tipo">${chamada.tipo}</div>
            <div class="guiche-info">
              Dirija-se ao
              <span class="guiche-badge">Guichê ${chamada.guiche}</span>
            </div>
          `;

          const box = document.getElementById('senhaBox');
          box.classList.add('highlight');
          setTimeout(() => box.classList.remove('highlight'), 3500);

          // Toca som específico do tipo
          tocarSom(chamada.tipo);

          // Adiciona ao histórico
          adicionarAoHistorico(chamada);
        }
      } catch (e) {
        console.warn('Erro ao buscar chamada', e);
      }
    }

    // Carrega histórico inicial (últimas chamadas já existentes)
    async function carregarHistoricoInicial() {
      try {
        const res = await fetch(API + '?status=chamado&sortBy=chamadoEm&order=desc&limit=40');
        if (!res.ok) return;
        let data = await res.json();

        // Também busca atendidos recentes para o histórico
        const res2 = await fetch(API + '?status=atendido&sortBy=chamadoEm&order=desc&limit=40');
        if (res2.ok) {
          const atendidos = await res2.json();
          data = data.concat(atendidos);
        }

        // Ordena por chamadoEm desc
        data.sort((a, b) => {
          const da = a.chamadoEm || '';
          const db = b.chamadoEm || '';
          return db.localeCompare(da);
        });

        // Preenche histórico (mais recentes primeiro, sem duplicar)
        const vistos = new Set();
        for (const item of data) {
          const key = `${item.tipo}-${item.numero}`;
          if (vistos.has(key)) continue;
          vistos.add(key);

          if (!historicoPorTipo[item.tipo]) continue;
          if (historicoPorTipo[item.tipo].length >= 5) continue;

          historicoPorTipo[item.tipo].push({
            numero: item.numero,
            guiche: item.guiche
          });
        }
        renderHistorico();
      } catch (e) {
        console.warn('Erro ao carregar histórico inicial', e);
        renderHistorico();
      }
    }

    // Inicialização
    renderHistorico();
    carregarHistoricoInicial();
    buscarUltimaChamada();
    setInterval(buscarUltimaChamada, 2000);

    // Alguns navegadores bloqueiam áudio até interação do usuário
    document.body.addEventListener('click', () => {
      getAudioContext();
    }, { once: true });
  </script>
</body>
</html>
